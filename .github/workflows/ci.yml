name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-php-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Check PHP syntax
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Check JavaScript syntax
        run: find . -path './.git' -prune -o -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Check tracked HTML is present
        run: test -n "$(git ls-files '*.html')"
